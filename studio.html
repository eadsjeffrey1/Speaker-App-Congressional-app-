<!-- Tells browser that the file is html-->
<html>
    <!-- Basically the settings of the page or like general info??-->
    <!-- Everything in head is metadata that tells the body how its contents should look -->
    <head>
        <!-- Title in URL-->
        <title>studio-page</title>
        
        <!--Connects Html to css file page (Note CSS is a dif language than html used to make the looks of the website)-->
        
        <!--Main Css File-->
        <link rel="stylesheet" href="speaker.css">
        
        <!--Specific Page CSS File-->
        <link rel="stylesheet" href="studio.css">

        <!--Loads bodyTracker_Script as a module(imodule is a file that can import code from other files)-->
        <script type = "module" src = "bodyTracker_Script.js"></script>
    </head>
    
    <!-- Body is the actual contents of the page with the visuals chosen by the head -->
    <body>
        <!-- Heading of page -->
        <h1 class="title" >Studio</h1>

        <div class = "taskBar">
            <!-- Side button links (Note: Add css class to make it pretty) -->
            <!--<a class="sideButton" href="settings.html">Settings</a>-->
                <!--<a class="sideButton" href="index.html">Home</a>-->
            <a class="sideButton" href="studio.html">Studio</a>
            <a class="sideButton" href="results.html">Results</a>
        </div>

        <!-- div makes a container containing all the main features of the page -->
        <div class="mainContent">
            <div class = "leftContent">  
            <!-- makes a container for buttons -->
                <div class = "buttonRow">
                        <!-- Creates Mic Button--> 
                        <button id = "Mic_Button" class="micButton">Start Recording</button>
                        
                        <!-- Creates Trash Button--> 
                        <button id = "Trash_Button" class="trashButton">Trash</button>

                </div>

                <div class = "showSpeech">
                    <!-- Text Box for speech words-->
                    <textarea id="text-box" class="text-box" placeholder="Speech goes here..."></textarea> 

                    <!-- Webcam-->
                    <video id="webcam" class = "webcamBox" autoplay></video>

                </div>
            </div> 



            <div class = "bulletBox">
                <!-- Create bullet point list for the check sentences-->
                <div class="checkBox">

                <div id="bullet-list">

                    <div class="bullet-item">
                        <span>1.</span>
                        <textarea placeholder="Sentences to check here...."></textarea>
                    </div>

                </div>

                <button id="add-bullet" type="button">+</button>
            </div>
        </div>

        <!--Loads Mic and Webcam JavaScript Instructions-->
        <script src = "micScript.js"></script>
        

        

    </body>
</html>
