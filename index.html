<!-- Tells browser that the file is html-->
<html>
    <!-- Basically the settings of the page or like general info??-->
    <!-- Everything in head is metadata that tells the body how its contents should look -->
    <head>
        <!-- Title in URL-->
        <title>PrePresentation</title>
        
        <!-- <style> is used to define how stuff looks-->
        <!-- STYLE IS CSS NOT HTML COMMENTS AND STUFF WORK DIF HERE-->
        <!-- CSS IS LIKE APPEARANCE HTML IS STRUCTURE-->
        <style>
            
            /*This is how CSS comments work */
            body {
                /*Sets the background color to powder blue */
                background-color: powderblue;
            }
            /*Title class controls how the title looks*/
            .title {
                color: #050D1F;
                font-size: 60px;
                text-align: center;
                margin-top: 35px;
            }
        </style>

    </head>
    <!-- Body is the actual contents of the page with the visuals chosen by the head -->
    <body>
        <h1 class = "title">PrePresentation</h1>
    </body>
</html>
